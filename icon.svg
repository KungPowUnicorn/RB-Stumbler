<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    RB Stumbler icon: a red infinity on a black tile.

    A single closed lemniscate path rather than two overlapping rings (which
    read as a chain link at 16px) and rather than a <text> glyph, because font
    rendering varies by renderer and machine — which is how an icon ends up
    looking different in the toolbar, the extension list and the side panel.
    Paths render identically everywhere.
  -->
  <rect width="128" height="128" rx="26" fill="#000000"/>
  <path
    d="M 26 64
       C 26 42, 46 42, 64 64
       C 82 86, 102 86, 102 64
       C 102 42, 82 42, 64 64
       C 46 86, 26 86, 26 64
       Z"
    fill="none"
    stroke="#ef4444"
    stroke-width="12"
    stroke-linejoin="round"
    stroke-linecap="round"/>
</svg>